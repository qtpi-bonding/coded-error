[package]
name = "coded-error"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Typed, coded errors with stable codes, classes, fingerprints and boundary mappings"

[features]
default = ["anyhow"]
anyhow = ["dep:anyhow"]
serde = ["dep:serde"]
grpc = ["dep:tonic"]
http = ["serde"]
mcp = ["serde", "dep:rmcp", "dep:serde_json"]
cli = []
proto = ["dep:prost"]
sqlx = ["dep:sqlx-core"]

[dependencies]
coded-error-derive = { path = "../coded-error-derive", version = "0.1.0" }
sha2 = "0.10"
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tonic = { version = ">=0.13, <0.15", default-features = false, optional = true }
prost = { version = ">=0.13, <0.15", optional = true }
rmcp = { version = "1.1", default-features = false, optional = true }
sqlx-core = { version = "0.7", default-features = false, optional = true }

[dev-dependencies]
thiserror = "2"
trybuild = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
